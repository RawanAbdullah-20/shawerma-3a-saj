<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شاورما ع صاج — لوحة إدارة الفروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:       #F8F2E6;
    --cream-2:     #F1E9D8;
    --paper:       #FFFFFF;
    --ink:         #1A1410;
    --ink-soft:    #5A4F44;
    --ink-faint:   #948877;
    --line:        #E8DFCA;
    --line-2:      #DCD0B5;
    --red:         #C8102E;
    --red-deep:    #9A0B22;
    --red-soft:    #F4D7DC;
    --green:       #2F8F4F;
    --green-soft:  #D4E8DA;
    --shadow-warm: rgba(122, 76, 33, 0.08);
    --glow-1:      rgba(200, 16, 46, 0.04);
    --glow-2:      rgba(200, 16, 46, 0.03);
  }

  [data-theme="dark"] {
    --cream:       #0E141C;
    --cream-2:     #182030;
    --paper:       #1A2433;
    --ink:         #F0EADC;
    --ink-soft:    #A7B0C0;
    --ink-faint:   #6E7889;
    --line:        #2A3445;
    --line-2:      #3A4458;
    --red:         #E63854;
    --red-deep:    #B81E3A;
    --red-soft:    rgba(230, 56, 84, 0.18);
    --green:       #4ADE80;
    --green-soft:  rgba(74, 222, 128, 0.16);
    --shadow-warm: rgba(0, 0, 0, 0.55);
    --glow-1:      rgba(230, 56, 84, 0.08);
    --glow-2:      rgba(230, 56, 84, 0.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100vh; height: 100dvh; overflow: hidden; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Tajawal', system-ui, sans-serif;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background-image:
      radial-gradient(circle at 20% 30%, var(--glow-1) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, var(--glow-2) 0%, transparent 45%);
    pointer-events: none;
  }
  .app {
    position: relative; z-index: 1;
    padding: 8px 16px 10px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- HEADER --- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px; margin-bottom: 6px; padding-bottom: 6px;
    border-bottom: 2px solid var(--ink);
    flex-shrink: 0;
  }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  .logo-wrap { width: 56px; height: 56px; display: grid; place-items: center; flex-shrink: 0; }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .brand-text h1 { margin: 0; font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1.1; }
  .brand-text .subtitle {
    margin-top: 2px; color: var(--ink-soft); font-size: 12px; font-weight: 500;
    font-family: 'Playfair Display', serif; font-style: italic; letter-spacing: 0.05em;
  }
  .brand-text .subtitle .ar { font-family: 'Tajawal', sans-serif; font-style: normal; }
  .clock { display: flex; align-items: baseline; gap: 10px; }
  .clock-time { font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 700; color: var(--red); line-height: 1; }
  .clock-ampm { font-size: 20px; font-weight: 800; color: var(--red); }

  /* hour-format toggle */
  .hour-toggle {
    display: inline-flex;
    background: var(--cream-2);
    border-radius: 999px;
    padding: 3px;
    border: 1px solid var(--line);
    margin-right: 4px;
  }
  .hour-opt {
    border: none; background: transparent;
    padding: 4px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 800;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 999px;
    transition: all 0.15s ease;
    line-height: 1;
  }
  .hour-opt:hover { color: var(--ink); }
  .hour-opt.active {
    background: var(--red); color: white;
    box-shadow: 0 2px 6px -2px var(--red);
  }
  .clock-ampm.hidden { display: none; }

  /* theme toggle (sun / moon) */
  .theme-toggle {
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    background: var(--cream-2);
    border-radius: 10px;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.18s ease;
    padding: 0;
  }
  .theme-toggle:hover {
    color: var(--red); border-color: var(--red);
    transform: rotate(15deg);
  }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .moon-icon { display: none; }
  [data-theme="dark"] .theme-toggle .sun-icon { display: none; }
  [data-theme="dark"] .theme-toggle .moon-icon { display: block; }
  .clock-date { color: var(--ink-soft); font-size: 16px; font-weight: 600; margin-right: 12px; }

  /* --- HEADER TOOLS (merged toolbar inside header) --- */
  .header-tools {
    display: flex; align-items: center; gap: 18px;
  }
  .header-stats { display: flex; gap: 12px; align-items: center; }
  .stat {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    padding: 4px 10px;
    background: var(--cream-2);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .stat strong { color: var(--red); font-family: 'JetBrains Mono', monospace; font-weight: 800; }

  /* --- FLOATING SAVE TOAST --- */
  .save-toast {
    position: fixed;
    bottom: 18px; left: 18px;
    background: var(--ink);
    color: var(--paper);
    padding: 8px 16px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 800;
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 60;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,0.3);
  }
  .save-toast.show { opacity: 1; transform: translateY(0); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px; font-weight: 800;
    border-radius: 10px; cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--red); color: white; }
  .btn-primary:hover { background: var(--red-deep); box-shadow: 0 6px 18px -6px var(--red); }
  .btn-ghost {
    background: transparent; color: var(--red); border-color: var(--red);
  }
  .btn-ghost:hover { background: var(--red-soft); }
  .btn-icon {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    padding: 0; border-radius: 8px;
    background: transparent; color: var(--ink-faint);
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 18px; font-weight: 900;
    line-height: 1;
    transition: all 0.15s ease;
  }
  .btn-icon:hover { background: var(--red-soft); color: var(--red); border-color: var(--red); }

  /* --- TABLES --- */
  .tables {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }
  .table-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 0 var(--paper) inset, 0 14px 32px -16px var(--shadow-warm), 0 4px 12px -8px var(--shadow-warm);
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .table-card::before {
    content: ''; position: absolute; top: 0; right: 0; left: 0; height: 5px;
    background: linear-gradient(90deg, var(--red) 0%, var(--red-deep) 100%);
  }
  .table-card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 22px 5px; border-bottom: 1px solid var(--line);
  }
  .table-card-head .title-block { display: flex; align-items: baseline; gap: 10px; }
  .table-card-head .num {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 900;
    font-size: 26px; color: var(--red); line-height: 1;
  }
  .table-card-head h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--ink); }
  .branch-count {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft);
    padding: 5px 11px; background: var(--cream-2); border: 1px solid var(--line);
    border-radius: 999px; letter-spacing: 0.04em;
  }

  table { width: 100%; min-width: 100%; border-collapse: collapse; }

  /* horizontal + vertical scroll container — kicks in when content overflows */
  .table-scroll {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
    min-height: 0;
  }
  .table-scroll::-webkit-scrollbar { height: 10px; width: 10px; }
  .table-scroll::-webkit-scrollbar-track { background: var(--cream-2); }
  .table-scroll::-webkit-scrollbar-thumb {
    background: var(--line-2); border-radius: 5px;
    border: 2px solid var(--cream-2);
  }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: var(--red); }
  thead th {
    text-align: right; padding: 8px 22px; font-size: 22px; font-weight: 800;
    color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--cream); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 2;
    white-space: nowrap;
  }
  thead th .col-head { display: inline-flex; align-items: center; gap: 6px; }
  thead th .col-del { opacity: 0; transition: opacity 0.15s ease; }
  thead th:hover .col-del { opacity: 1; }
  thead th.col-data { text-align: center; min-width: 150px; }
  thead th.col-data .col-head { justify-content: center; }
  /* sticky branch-name column (RTL → right edge) */
  thead th:first-child,
  tbody td:first-child {
    position: sticky;
    right: 0;
    box-shadow: -6px 0 8px -6px rgba(0,0,0,0.05);
    min-width: 220px;
  }
  thead th:first-child { background: var(--cream); z-index: 4; }
  tbody td:first-child { background: var(--paper); z-index: 1; }
  tbody tr:hover td:first-child { background: var(--cream); }

  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: var(--cream); }
  tbody tr + tr td { border-top: 1px solid var(--line); }

  /* closed (stopped) branch — click row to toggle */
  tbody tr.closed { background: rgba(200, 16, 46, 0.18); }
  tbody tr.closed:hover { background: rgba(200, 16, 46, 0.26); }
  tbody tr.closed td:first-child {
    background: rgba(200, 16, 46, 0.22);
    box-shadow: inset -5px 0 0 var(--red);
  }
  tbody tr.closed:hover td:first-child { background: rgba(200, 16, 46, 0.3); }
  tbody tr.closed .bname {
    color: var(--red);
    font-weight: 900;
  }
  tbody tr.closed .branch-name-cell::before { background: var(--ink-faint); }
  tbody tr.closed .num-field,
  tbody tr.closed .field-input,
  tbody tr.closed .toggle-btn { opacity: 0.4; pointer-events: none; }
  .bn-closed-badge {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 16px; font-weight: 900;
    color: white; background: var(--red);
    border-radius: 999px;
    padding: 4px 14px;
    letter-spacing: 0.05em;
    margin-right: 8px;
    box-shadow: 0 0 0 0 rgba(200, 16, 46, 0.6);
    animation: closedPulse 1.8s ease-in-out infinite;
  }
  .bn-closed-badge svg { width: 16px; height: 16px; flex-shrink: 0; }
  tbody tr.closed .bn-closed-badge { display: inline-flex; }
  @keyframes closedPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200, 16, 46, 0.55); }
    50% { box-shadow: 0 0 0 8px rgba(200, 16, 46, 0); }
  }
  tbody td {
    padding: 4px 22px; font-size: 22px; font-weight: 600;
    vertical-align: middle; white-space: nowrap;
  }
  tbody td.cell-data { text-align: center; }

  .branch-name-cell {
    color: var(--ink); font-weight: 800; font-size: 26px;
    position: relative; padding-right: 36px !important;
    white-space: nowrap;
  }
  .branch-name-cell::before {
    content: ''; position: absolute; right: 22px; top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  }
  .branch-name-cell .bn-wrap {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .branch-name-cell .row-del {
    opacity: 0; transition: opacity 0.15s ease;
  }
  tbody tr:hover .row-del { opacity: 1; }

  /* --- DURATION INPUT --- */
  .dur {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--cream); border: 1.5px solid var(--line-2);
    border-radius: 12px; padding: 2px 14px;
    transition: all 0.15s ease;
  }
  .dur:hover { border-color: var(--red); background: var(--paper); }
  .dur:focus-within { border-color: var(--red); background: var(--paper); box-shadow: 0 0 0 3px var(--red-soft); }
  .dur input {
    width: 48px; border: none; background: transparent;
    font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 800;
    color: var(--ink); text-align: center; padding: 2px 0;
    direction: ltr; -moz-appearance: textfield;
  }
  .dur input::-webkit-outer-spin-button, .dur input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .dur input:focus { outline: none; }
  .dur .unit { font-size: 15px; font-weight: 800; color: var(--ink-faint); }
  .dur .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .dur.empty .unit, .dur.empty input { color: var(--ink-faint); }

  /* --- NUMBER + SUFFIX FIELD --- */
  .num-field {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--cream); border: 1.5px solid var(--line-2);
    border-radius: 12px; padding: 2px 16px;
    transition: all 0.15s ease;
  }
  .num-field:hover { border-color: var(--red); background: var(--paper); }
  .num-field:focus-within { border-color: var(--red); background: var(--paper); box-shadow: 0 0 0 3px var(--red-soft); }
  .num-field input {
    width: 76px; border: none; background: transparent;
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800;
    color: var(--ink); text-align: center; padding: 2px 0;
    direction: ltr; -moz-appearance: textfield;
  }
  .num-field input::-webkit-outer-spin-button,
  .num-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num-field input:focus { outline: none; }
  .num-field .unit { font-size: 15px; font-weight: 800; color: var(--ink-faint); }

  /* free-text variant: pickup/delivery — narrower, centered */
  .num-field.text-field input {
    font-family: 'Tajawal', sans-serif;
    width: 150px;
    text-align: center;
    direction: rtl;
    font-weight: 700;
  }

  /* --- GENERIC TEXT / NUMBER INPUT --- */
  .field-input {
    font-family: 'Tajawal', sans-serif; font-size: 22px; font-weight: 700;
    color: var(--ink);
    background: var(--cream);
    border: 1.5px solid var(--line-2);
    border-radius: 10px;
    padding: 3px 14px;
    min-width: 120px; max-width: 200px;
    text-align: center;
    transition: all 0.15s ease;
  }
  .field-input:hover { border-color: var(--red); background: var(--paper); }
  .field-input:focus { outline: none; border-color: var(--red); background: var(--paper); box-shadow: 0 0 0 3px var(--red-soft); }

  /* --- TOGGLE --- */
  .toggle-btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 3px 20px; border-radius: 999px;
    font-size: 18px; font-weight: 800; cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 0.12s ease;
    user-select: none; min-width: 160px; justify-content: center;
    font-family: 'Tajawal', sans-serif;
  }
  .toggle-btn:hover { transform: translateY(-1px); }
  .toggle-btn .dot { width: 11px; height: 11px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
  .toggle-btn.on  { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .toggle-btn.on  .dot { box-shadow: 0 0 10px var(--green); }
  .toggle-btn.off { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .toggle-btn.off .dot { box-shadow: 0 0 10px var(--red); }
  @keyframes pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.9); } }

  /* --- ADD BRANCH (table footer) --- */
  .add-branch-row {
    padding: 5px 22px 6px;
    border-top: 1px dashed var(--line-2);
    background: var(--cream);
  }
  .add-branch-btn {
    width: 100%;
    padding: 4px;
    border: 1.5px dashed var(--line-2);
    border-radius: 10px;
    background: transparent;
    color: var(--ink-faint);
    font-family: 'Tajawal', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .add-branch-btn:hover {
    border-color: var(--red); color: var(--red); background: var(--paper);
  }

  /* --- NOTES --- */
  .notes-card {
    margin-top: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 0 var(--paper) inset, 0 14px 32px -16px var(--shadow-warm), 0 4px 12px -8px var(--shadow-warm);
    position: relative;
    flex-shrink: 0;
  }
  .notes-card::before {
    content: ''; position: absolute; top: 0; right: 0; left: 0; height: 5px;
    background: linear-gradient(90deg, var(--red) 0%, var(--red-deep) 100%);
  }
  .notes-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 22px 4px; border-bottom: 1px solid var(--line);
  }
  .notes-head .title-block { display: flex; align-items: baseline; gap: 10px; }
  .notes-head .num { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 900; font-size: 22px; color: var(--red); line-height: 1; }
  .notes-head h2 { margin: 0; font-size: 17px; font-weight: 800; color: var(--ink); }
  .notes-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-soft);
    padding: 4px 10px; background: var(--cream-2); border: 1px solid var(--line);
    border-radius: 999px; letter-spacing: 0.04em;
  }
  .notes-area {
    width: 100%; min-height: 70px; max-height: 95px;
    border: none; background: transparent;
    padding: 8px 22px; font-family: 'Tajawal', sans-serif;
    font-size: 36px; font-weight: 700; color: var(--ink);
    line-height: 1.25; resize: none; direction: rtl;
    overflow-y: auto;
  }
  .notes-area:focus { outline: none; background: var(--cream); }
  .notes-area::placeholder { color: var(--ink-faint); font-style: italic; }

  /* --- MODAL --- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(26, 20, 16, 0.45);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.18s ease-out;
  }
  .modal-backdrop.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn  { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-card {
    background: var(--paper);
    border-radius: 16px;
    width: 100%; max-width: 440px;
    padding: 22px 26px 20px;
    box-shadow: 0 24px 60px -12px rgba(0,0,0,0.25);
    position: relative;
    border: 1px solid var(--line);
    animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal-card::before {
    content: ''; position: absolute; top: 0; right: 0; left: 0; height: 5px;
    background: linear-gradient(90deg, var(--red), var(--red-deep));
    border-radius: 16px 16px 0 0;
  }
  .modal-icon {
    width: 56px; height: 56px;
    margin: 4px auto 14px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--red-soft);
    color: var(--red);
  }
  .modal-icon svg { width: 28px; height: 28px; }
  .modal-card.danger .modal-icon {
    background: var(--red-soft); color: var(--red);
  }
  .modal-card h3 {
    margin: 6px 0 14px; font-size: 20px; font-weight: 900; color: var(--ink);
  }
  .modal-card.with-icon h3 { text-align: center; margin-top: 0; }
  .modal-message {
    font-size: 15px; color: var(--ink-soft); line-height: 1.6;
    margin: -6px 0 18px;
    text-align: center;
  }
  .field-group { margin-bottom: 14px; }
  .field-group label {
    display: block; font-size: 13px; font-weight: 700;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .field-group input, .field-group select {
    width: 100%; padding: 10px 12px;
    font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 600;
    color: var(--ink);
    background: var(--cream);
    border: 1.5px solid var(--line-2);
    border-radius: 10px;
    transition: all 0.15s ease;
  }
  .field-group input:focus, .field-group select:focus {
    outline: none; border-color: var(--red); background: var(--paper);
    box-shadow: 0 0 0 3px var(--red-soft);
  }
  .toggle-labels-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-start;
    margin-top: 8px;
  }
  .modal-actions .btn { flex: 1; justify-content: center; padding: 11px; }

  /* big screen */
  @media (min-width: 2200px) {
    .app { padding: 14px 40px; }
    .brand-text h1 { font-size: 26px; }
    .clock-time { font-size: 48px; }
    .logo-wrap { width: 64px; height: 64px; }
    tbody td { font-size: 26px; padding: 6px 26px; }
    .branch-name-cell { font-size: 32px; padding-right: 42px !important; }
    .branch-name-cell::before { width: 10px; height: 10px; right: 24px; }
    .dur input { font-size: 32px; width: 56px; }
    .num-field input { font-size: 36px; width: 92px; }
    .num-field.text-field input { width: 170px; font-size: 30px; }
    .num-field, .dur { padding: 2px 18px; }
    .num-field .unit, .dur .unit { font-size: 18px; }
    .toggle-btn { font-size: 22px; min-width: 180px; padding: 3px 22px; }
    .toggle-btn .dot { width: 12px; height: 12px; }
    .field-input { font-size: 26px; padding: 3px 16px; }
    .bn-closed-badge { font-size: 20px; padding: 5px 16px; gap: 8px; }
    .bn-closed-badge svg { width: 18px; height: 18px; }
    thead th { font-size: 26px; padding: 9px 26px; }
    thead th:first-child, tbody td:first-child { min-width: 280px; }
    thead th.col-data { min-width: 200px; }
    .table-card-head { padding: 7px 26px 5px; }
    .table-card-head h2 { font-size: 22px; }
    .table-card-head .num { font-size: 30px; }
    .add-branch-row { padding: 6px 26px 7px; }
    .add-branch-btn { font-size: 16px; padding: 5px; }
    .notes-head { padding: 5px 26px 4px; }
    .notes-head h2 { font-size: 20px; }
    .notes-area { font-size: 42px; font-weight: 700; min-height: 80px; max-height: 110px; padding: 10px 26px; }
    .btn { font-size: 15px; padding: 8px 16px; }
  }

  /* true 4K / 50" displays — scale everything up further */
  @media (min-width: 3000px) {
    .app { padding: 16px 60px; }
    .brand-text h1 { font-size: 34px; }
    .brand-text .subtitle { font-size: 16px; }
    .clock-time { font-size: 62px; }
    .clock-ampm { font-size: 28px; }
    .clock-date { font-size: 20px; }
    .hour-opt { font-size: 16px; padding: 6px 14px; }
    .logo-wrap { width: 84px; height: 84px; }
    .stat { font-size: 16px; }
    .btn { font-size: 17px; padding: 10px 18px; }
    .table-card-head { padding: 8px 30px 6px; }
    .table-card-head h2 { font-size: 28px; }
    .table-card-head .num { font-size: 38px; }
    .branch-count { font-size: 14px; padding: 6px 14px; }
    thead th { font-size: 32px; padding: 11px 30px; }
    thead th:first-child, tbody td:first-child { min-width: 320px; }
    thead th.col-data { min-width: 240px; }
    tbody td { font-size: 32px; padding: 7px 30px; }
    .branch-name-cell { font-size: 38px; padding-right: 50px !important; }
    .branch-name-cell::before { width: 12px; height: 12px; right: 28px; }
    .num-field input { font-size: 44px; width: 110px; }
    .num-field.text-field input { width: 200px; font-size: 36px; }
    .num-field { padding: 3px 20px; }
    .num-field .unit, .dur .unit { font-size: 22px; }
    .dur { padding: 3px 20px; }
    .dur input { font-size: 38px; width: 64px; }
    .toggle-btn { font-size: 26px; min-width: 220px; padding: 4px 26px; }
    .toggle-btn .dot { width: 14px; height: 14px; }
    .field-input { font-size: 30px; padding: 4px 18px; min-width: 150px; }
    .bn-closed-badge { font-size: 24px; padding: 6px 20px; gap: 10px; }
    .bn-closed-badge svg { width: 22px; height: 22px; }
    tbody tr.closed td:first-child { box-shadow: inset -7px 0 0 var(--red); }
    .add-branch-row { padding: 7px 30px 8px; }
    .add-branch-btn { font-size: 18px; padding: 6px; }
    .notes-head { padding: 6px 30px 5px; }
    .notes-head h2 { font-size: 26px; }
    .notes-head .num { font-size: 36px; }
    .notes-area { font-size: 54px; font-weight: 700; min-height: 100px; max-height: 145px; padding: 14px 32px; line-height: 1.25; }
  }
</style>

<script>
  /* ---------------- DEFAULTS ---------------- */
  const INITIAL_BRANCHES = [
    'السيتي مول', 'تلاع العلي', 'مول 5B', 'الرينبو', 'الفحيص',
    'الياسمين', 'سلط', 'اللويبدة', 'الامير راشد', 'صويفية',
    'شميساني', 'دابوق', 'طبربور', 'المدينة', 'مقابلين',
    'غوشة', 'الجبيهة', 'مرج الحمام', 'عبدون'
  ];

  function defaultColumns() {
    return [
      { id: 'pickup',   name: 'استلام', type: 'text', suffix: 'د' },
      { id: 'delivery', name: 'توصيل',  type: 'text', suffix: 'د' },
      { id: 'visa',     name: 'فيزا',   type: 'toggle', onLabel: 'متوفرة', offLabel: 'غير متوفرة' },
    ];
  }

  function defaultValueFor(type) {
    if (type === 'duration') return { h: '', m: '' };
    if (type === 'toggle')   return true;
    return ''; // text or number
  }

  function uid() { return Math.random().toString(36).slice(2, 9); }

  function defaultState() {
    return {
      columns: defaultColumns(),
      branches: INITIAL_BRANCHES.map((name, i) => ({
        id: uid(), name, group: i < 10 ? 1 : 2, data: {}, closed: false
      })),
      notes: '',
      clockFormat: '12',
      theme: 'light'
    };
  }

  let state = defaultState();

  /* ---------------- STORAGE ---------------- */
  const STORAGE_KEY = 'shawerma-board-state-v3';
  const storage = {
    async get(k) {
      try {
        if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
          const res = await window.storage.get(k);
          return res ? res.value : null;
        }
      } catch (e) {}
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    async set(k, v) {
      try {
        if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
          await window.storage.set(k, v); return true;
        }
      } catch (e) {}
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    }
  };

  async function loadState() {
    let parsed = null;
    try {
      // try new key first
      const raw = await storage.get(STORAGE_KEY);
      if (raw) parsed = JSON.parse(raw);
      // try old keys for migration
      if (!parsed) {
        const oldRaw = (await storage.get('shawerma-board-state-v2')) ||
                       (await storage.get('shawerma-board-state-v1'));
        if (oldRaw) parsed = JSON.parse(oldRaw);
      }
    } catch (e) { parsed = null; }

    if (parsed && Array.isArray(parsed.columns) && Array.isArray(parsed.branches)) {
      state = parsed;
    } else if (parsed) {
      // migrate from older shapes
      state = defaultState();
      const oldBranches = parsed.branches && typeof parsed.branches === 'object' && !Array.isArray(parsed.branches)
        ? parsed.branches : parsed;
      state.notes = (parsed.notes && typeof parsed.notes === 'string') ? parsed.notes : '';
      state.branches.forEach(b => {
        const old = oldBranches[b.name];
        if (old && typeof old === 'object') {
          if (old.pickup)   b.data['pickup']   = old.pickup;
          if (old.delivery) b.data['delivery'] = old.delivery;
          if (typeof old.visa === 'boolean') b.data['visa'] = old.visa;
        }
      });
    }
    ensureShape();
  }

  function ensureShape() {
    if (!Array.isArray(state.columns)) state.columns = defaultColumns();
    if (!Array.isArray(state.branches)) state.branches = [];
    if (typeof state.notes !== 'string') state.notes = '';
    if (state.clockFormat !== '24' && state.clockFormat !== '12') state.clockFormat = '12';
    if (state.theme !== 'dark' && state.theme !== 'light') state.theme = 'light';

    // Migration: pickup/delivery used to be 'duration' ({h,m}) — convert to total minutes (now text)
    state.columns.forEach(col => {
      if ((col.id === 'pickup' || col.id === 'delivery') && col.type === 'duration') {
        col.type = 'text';
        col.suffix = 'د';
        state.branches.forEach(b => {
          const v = b.data && b.data[col.id];
          if (v && typeof v === 'object' && ('h' in v || 'm' in v)) {
            const h = parseInt(v.h, 10) || 0;
            const m = parseInt(v.m, 10) || 0;
            const total = h * 60 + m;
            b.data[col.id] = total > 0 ? String(total) : '';
          }
        });
      }
      // Migration: pickup/delivery from 'number' to 'text' (free text now)
      if ((col.id === 'pickup' || col.id === 'delivery') && col.type === 'number') {
        col.type = 'text';
        if (!col.suffix) col.suffix = 'د';
      }
    });

    state.branches.forEach(b => {
      if (!b.id) b.id = uid();
      if (!b.data) b.data = {};
      if (typeof b.closed !== 'boolean') b.closed = false;
      state.columns.forEach(col => {
        if (!(col.id in b.data)) b.data[col.id] = defaultValueFor(col.type);
      });
    });
  }

  let saveTimer = null;
  function saveState() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const ok = await storage.set(STORAGE_KEY, JSON.stringify(state));
      if (ok) {
        const ind = document.getElementById('saveIndicator');
        ind.classList.add('show');
        setTimeout(() => ind.classList.remove('show'), 1200);
      }
    }, 250);
  }

  /* ---------------- HELPERS ---------------- */
  function clampNum(v, max) {
    if (v === '' || v == null) return '';
    let n = parseInt(v, 10);
    if (isNaN(n) || n < 0) return '';
    if (n > max) n = max;
    return String(n);
  }
  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    children.forEach(c => e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return e;
  }

  /* ---------------- CELL RENDERERS ---------------- */
  function buildDurationCell(branch, col) {
    const v = branch.data[col.id] || { h: '', m: '' };
    const wrap = el('div', { class: 'dur' + (!v.h && !v.m ? ' empty' : '') });
    const hIn = el('input', { type: 'number', min: '0', max: '23', inputmode: 'numeric', placeholder: '0', value: v.h });
    const mIn = el('input', { type: 'number', min: '0', max: '59', inputmode: 'numeric', placeholder: '0', value: v.m });
    const bindIn = (input, part, max) => {
      input.addEventListener('input', () => {
        const clean = clampNum(input.value, max);
        if (input.value !== clean) input.value = clean;
        branch.data[col.id][part] = clean;
        const empty = !branch.data[col.id].h && !branch.data[col.id].m;
        wrap.classList.toggle('empty', empty);
        saveState();
      });
    };
    bindIn(hIn, 'h', 23);
    bindIn(mIn, 'm', 59);
    wrap.appendChild(hIn);
    wrap.appendChild(el('span', { class: 'unit', html: 'س' }));
    wrap.appendChild(el('span', { class: 'sep' }));
    wrap.appendChild(mIn);
    wrap.appendChild(el('span', { class: 'unit', html: 'د' }));
    return wrap;
  }

  function buildToggleCell(branch, col) {
    const onLabel  = col.onLabel  || 'نعم';
    const offLabel = col.offLabel || 'لا';
    const val = branch.data[col.id] !== false; // default true
    const btn = el('button', { class: 'toggle-btn ' + (val ? 'on' : 'off') });
    btn.appendChild(el('span', { class: 'dot' }));
    const lbl = el('span', { class: 'label', html: val ? onLabel : offLabel });
    btn.appendChild(lbl);
    btn.addEventListener('click', () => {
      const cur = branch.data[col.id] !== false;
      branch.data[col.id] = !cur;
      btn.classList.toggle('on'); btn.classList.toggle('off');
      lbl.textContent = !cur ? onLabel : offLabel;
      saveState();
    });
    return btn;
  }

  function buildTextCell(branch, col, isNumber) {
    const input = el('input', {
      type: isNumber ? 'number' : 'text',
      placeholder: isNumber ? '0' : '—',
      value: branch.data[col.id] ?? ''
    });
    if (isNumber) {
      input.setAttribute('min', '0');
      input.setAttribute('inputmode', 'numeric');
    }
    input.addEventListener('input', () => {
      branch.data[col.id] = input.value;
      saveState();
    });
    if (col.suffix) {
      const wrap = el('div', { class: 'num-field' + (isNumber ? '' : ' text-field') });
      wrap.appendChild(input);
      wrap.appendChild(el('span', { class: 'unit', html: col.suffix }));
      return wrap;
    }
    input.className = 'field-input';
    return input;
  }

  function buildCell(branch, col) {
    if (col.type === 'duration') return buildDurationCell(branch, col);
    if (col.type === 'toggle')   return buildToggleCell(branch, col);
    if (col.type === 'number')   return buildTextCell(branch, col, true);
    return buildTextCell(branch, col, false);
  }

  /* ---------------- TABLE RENDER ---------------- */
  function buildHeader(group) {
    const thead = document.getElementById('thead' + group);
    thead.innerHTML = '';
    const tr = el('tr');
    tr.appendChild(el('th', { html: '<div class="col-head"><span>اسم الفرع</span></div>' }));
    state.columns.forEach(col => {
      const th = el('th', { class: 'col-data' });
      const head = el('div', { class: 'col-head' });
      head.appendChild(el('span', { html: col.name }));
      const del = el('button', { class: 'btn-icon col-del', title: 'حذف العمود', html: '×' });
      del.addEventListener('click', () => removeColumn(col.id));
      head.appendChild(del);
      th.appendChild(head);
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  function buildRow(branch) {
    const tr = el('tr');
    if (branch.closed) tr.classList.add('closed');

    const nameTd = el('td', { class: 'branch-name-cell' });
    const wrap = el('div', { class: 'bn-wrap' });
    wrap.appendChild(el('span', { class: 'bname', html: branch.name }));
    wrap.appendChild(el('span', {
      class: 'bn-closed-badge',
      html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>مغلق'
    }));
    const del = el('button', { class: 'btn-icon row-del', title: 'حذف الفرع', html: '×' });
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      removeBranch(branch.id);
    });
    wrap.appendChild(del);
    nameTd.appendChild(wrap);
    tr.appendChild(nameTd);

    state.columns.forEach(col => {
      const td = el('td', { class: 'cell-data' });
      td.appendChild(buildCell(branch, col));
      tr.appendChild(td);
    });

    // Click anywhere on the row (except inputs / buttons) to toggle closed
    tr.addEventListener('click', (e) => {
      if (e.target.closest('input, button, .toggle-btn, .row-del, .col-del')) return;
      branch.closed = !branch.closed;
      tr.classList.toggle('closed', branch.closed);
      saveState();
    });

    return tr;
  }

  function renderGroup(group) {
    buildHeader(group);
    const tbody = document.getElementById('tbody' + group);
    tbody.innerHTML = '';
    const groupBranches = state.branches.filter(b => b.group === group);
    groupBranches.forEach(b => tbody.appendChild(buildRow(b)));
    document.getElementById('count' + group).textContent = groupBranches.length + ' فروع';
  }

  function renderAll() {
    renderGroup(1);
    renderGroup(2);
    document.getElementById('totalBranches').textContent = state.branches.length;
    document.getElementById('totalColumns').textContent = state.columns.length;
  }

  /* ---------------- ACTIONS ---------------- */
  function addBranch(group, name) {
    const branch = { id: uid(), name, group, data: {}, closed: false };
    state.columns.forEach(col => branch.data[col.id] = defaultValueFor(col.type));
    state.branches.push(branch);
    saveState();
    renderGroup(group);
    document.getElementById('totalBranches').textContent = state.branches.length;
  }

  function removeBranch(id) {
    const branch = state.branches.find(b => b.id === id);
    if (!branch) return;
    openConfirm({
      title: `حذف فرع "${branch.name}"؟`,
      message: 'سيتم حذف كل بيانات هذا الفرع. لا يمكن التراجع عن هذا الإجراء.',
      confirmLabel: 'حذف الفرع',
      onConfirm: () => {
        state.branches = state.branches.filter(b => b.id !== id);
        saveState();
        renderGroup(branch.group);
        document.getElementById('totalBranches').textContent = state.branches.length;
      }
    });
  }

  function addColumn(colDef) {
    colDef.id = uid();
    state.columns.push(colDef);
    state.branches.forEach(b => {
      b.data[colDef.id] = defaultValueFor(colDef.type);
    });
    saveState();
    renderAll();
  }

  function removeColumn(colId) {
    const col = state.columns.find(c => c.id === colId);
    if (!col) return;
    openConfirm({
      title: `حذف عمود "${col.name}"؟`,
      message: 'سيتم حذف هذا العمود وكل البيانات الموجودة فيه عبر كل الفروع.',
      confirmLabel: 'حذف العمود',
      onConfirm: () => {
        state.columns = state.columns.filter(c => c.id !== colId);
        state.branches.forEach(b => { delete b.data[colId]; });
        saveState();
        renderAll();
      }
    });
  }

  /* ---------------- MODAL ---------------- */
  const modal        = document.getElementById('modal');
  const modalCard    = document.getElementById('modalCard');
  const modalIcon    = document.getElementById('modalIcon');
  const modalTitle   = document.getElementById('modalTitle');
  const modalBody    = document.getElementById('modalBody');
  const modalCancel  = document.getElementById('modalCancel');
  const modalConfirm = document.getElementById('modalConfirm');
  let modalSubmit = null;

  const ICONS = {
    warning: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    trash:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>`,
    plus:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  };

  function openModal(opts) {
    modalTitle.textContent = opts.title || '';
    modalCard.className = 'modal-card' + (opts.variant === 'danger' ? ' danger' : '') + (opts.icon ? ' with-icon' : '');
    if (opts.icon && ICONS[opts.icon]) {
      modalIcon.style.display = '';
      modalIcon.innerHTML = ICONS[opts.icon];
    } else {
      modalIcon.style.display = 'none';
      modalIcon.innerHTML = '';
    }
    if (opts.message) {
      modalBody.innerHTML = `<div class="modal-message">${opts.message}</div>`;
    } else if (opts.bodyHtml) {
      modalBody.innerHTML = opts.bodyHtml;
    } else {
      modalBody.innerHTML = '';
    }
    modalConfirm.textContent = opts.confirmLabel || 'حفظ';
    modalCancel.textContent  = opts.cancelLabel  || 'إلغاء';
    modalSubmit = opts.onSubmit || null;
    modal.classList.add('show');
    setTimeout(() => {
      const first = modalBody.querySelector('input, select, textarea');
      if (first) first.focus();
      else modalConfirm.focus();
    }, 60);
  }
  function closeModal() {
    modal.classList.remove('show');
    modalSubmit = null;
  }

  function openConfirm({ title, message, confirmLabel, onConfirm }) {
    openModal({
      title,
      message,
      icon: 'trash',
      variant: 'danger',
      confirmLabel: confirmLabel || 'حذف',
      onSubmit: () => { onConfirm(); }
    });
  }

  modalCancel.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
    if (e.key === 'Enter' && modal.classList.contains('show') && document.activeElement.tagName !== 'TEXTAREA') {
      modalConfirm.click();
    }
  });
  modalConfirm.addEventListener('click', () => {
    if (modalSubmit) {
      const result = modalSubmit();
      if (result !== false) closeModal();
    }
  });

  function openAddBranchModal(group) {
    openModal({
      title: `إضافة فرع — المجموعة ${group === 1 ? 'الأولى' : 'الثانية'}`,
      icon: 'plus',
      bodyHtml: `<div class="field-group">
         <label for="branchName">اسم الفرع</label>
         <input id="branchName" type="text" placeholder="مثال: العبدلي مول" />
       </div>`,
      confirmLabel: 'إضافة الفرع',
      onSubmit: () => {
        const name = document.getElementById('branchName').value.trim();
        if (!name) { alert('يلزم اسم الفرع'); return false; }
        addBranch(group, name);
      }
    });
  }

  function openAddColumnModal() {
    openModal({
      title: 'إضافة عمود جديد',
      icon: 'plus',
      bodyHtml: `<div class="field-group">
         <label for="colName">اسم العمود</label>
         <input id="colName" type="text" placeholder="مثال: الكاش، التوصيل المجاني..." />
       </div>
       <div class="field-group">
         <label for="colType">نوع العمود</label>
         <select id="colType">
           <option value="number">رقم</option>
           <option value="duration">مدة (ساعات ودقائق)</option>
           <option value="toggle">مفتاح (متوفر / غير متوفر)</option>
           <option value="text">نص حر</option>
         </select>
       </div>
       <div class="field-group" id="numSuffixGroup">
         <label for="numSuffix">وحدة بجانب الرقم (اختياري)</label>
         <input id="numSuffix" type="text" placeholder="مثال: د، دينار، ٪" maxlength="6" />
       </div>
       <div class="field-group" id="toggleLabelsGroup" style="display:none;">
         <label>تسميات المفتاح (اختياري)</label>
         <div class="toggle-labels-grid">
           <input id="onLabel"  type="text" placeholder="متوفر" />
           <input id="offLabel" type="text" placeholder="غير متوفر" />
         </div>
       </div>`,
      confirmLabel: 'إضافة العمود',
      onSubmit: () => {
        const name = document.getElementById('colName').value.trim();
        const type = document.getElementById('colType').value;
        if (!name) { alert('يلزم اسم العمود'); return false; }
        const col = { name, type };
        if (type === 'toggle') {
          const on  = document.getElementById('onLabel').value.trim();
          const off = document.getElementById('offLabel').value.trim();
          col.onLabel  = on  || 'متوفر';
          col.offLabel = off || 'غير متوفر';
        } else if (type === 'number') {
          const sfx = document.getElementById('numSuffix').value.trim();
          if (sfx) col.suffix = sfx;
        }
        addColumn(col);
      }
    });
    // Show/hide conditional fields based on type
    const typeSel = document.getElementById('colType');
    const tlg = document.getElementById('toggleLabelsGroup');
    const nsg = document.getElementById('numSuffixGroup');
    const sync = () => {
      tlg.style.display = typeSel.value === 'toggle' ? 'block' : 'none';
      nsg.style.display = typeSel.value === 'number' ? 'block' : 'none';
    };
    typeSel.addEventListener('change', sync);
    sync();
  }

  /* ---------------- WIRING ---------------- */
  document.getElementById('addColumnBtn').addEventListener('click', openAddColumnModal);
  document.querySelectorAll('.add-branch-btn').forEach(btn => {
    btn.addEventListener('click', () => openAddBranchModal(parseInt(btn.dataset.group, 10)));
  });

  function setupNotes() {
    const ta = document.getElementById('notesArea');
    ta.value = state.notes || '';
    ta.addEventListener('input', () => { state.notes = ta.value; saveState(); });
  }

  /* ---------------- CLOCK ---------------- */
  function tickClock() {
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const pad = n => String(n).padStart(2, '0');
    const ampmEl = document.getElementById('clockAmPm');

    if (state.clockFormat === '24') {
      ampmEl.classList.add('hidden');
      document.getElementById('clockTime').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    } else {
      const ampm = h >= 12 ? 'م' : 'ص';
      h = h % 12; if (h === 0) h = 12;
      ampmEl.classList.remove('hidden');
      ampmEl.textContent = ampm;
      document.getElementById('clockTime').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    document.getElementById('clockDate').textContent =
      now.toLocaleDateString('ar-JO', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function syncHourToggle() {
    document.querySelectorAll('.hour-opt').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.h === state.clockFormat);
    });
  }

  document.querySelectorAll('.hour-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      state.clockFormat = btn.dataset.h;
      syncHourToggle();
      tickClock();
      saveState();
    });
  });

  /* ---------------- THEME ---------------- */
  function applyTheme() {
    if (state.theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }
  document.getElementById('themeToggleBtn').addEventListener('click', () => {
    state.theme = (state.theme === 'dark') ? 'light' : 'dark';
    applyTheme();
    saveState();
  });

  /* ---------------- INIT ---------------- */
  (async () => {
    tickClock();
    setInterval(tickClock, 1000);
    try { await loadState(); }
    catch (e) { console.error(e); state = defaultState(); }
    syncHourToggle();
    applyTheme();
    tickClock();
    renderAll();
    setupNotes();
  })();
</script>
</body>
</html>
